[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./reports/deployment" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 10000
depth = 50
fail_on_revert = true

[profile.monad]
match_path = "test/fork/*.t.sol"
fs_permissions = [{ access = "read", path = "./config" }, { access = "read", path = "./reports/monad" }, { access = "read-write", path = "./reports/deployment" }]

[rpc_endpoints]
monad = "${ALCHEMY_MONAD_RPC}"
monad_testnet = "${MONAD_TESTNET_RPC}"
tenderly = "${TENDERLY_RPC}"

[fmt]
line_length = 120
sort_imports = true

[lint]
lint_on_build = false
