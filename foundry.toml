[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 10000
depth = 50
fail_on_revert = true

[fmt]
line_length = 120
sort_imports = true

[lint]
lint_on_build = false
